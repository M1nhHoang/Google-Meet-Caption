<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MeetCap — Xem trước</title>
  <link rel="stylesheet" href="../ui/tokens.css">
  <style>
    body { padding: 30px 24px 90px; }
    .wrap { max-width: 860px; margin: 0 auto; }
    header {
      display: flex; flex-wrap: wrap; gap: 14px 18px; align-items: flex-end;
      padding-bottom: 18px; border-bottom: 1px solid var(--line); margin-bottom: 26px;
    }
    header .box { display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 240px; }
    header h1 { margin: 0; font: 600 clamp(22px, 3.4vw, 32px)/1.15 var(--display); text-wrap: balance; }
    header .meta { font: 500 12px/1.6 var(--mono); color: var(--text-3); }
    header .btnrow { flex: 0 0 auto; }
    header .btn { flex: 0 0 auto; }

    .turn { margin: 0 0 18px; }
    .turn .who {
      display: flex; align-items: baseline; gap: 10px; margin-bottom: 5px;
    }
    .turn .who b { font: 600 14px/1.2 var(--sans); }
    .turn .who span { font: 500 11.5px/1 var(--mono); color: var(--text-3); }
    .turn p { margin: 0 0 6px; font-size: 15px; line-height: 1.65; max-width: 68ch; }

    figure {
      margin: 0 0 24px; border: 1px solid var(--line); border-radius: var(--r-md);
      overflow: hidden; background: var(--surface);
    }
    figure img { display: block; width: 100%; height: auto; }
    figcaption {
      font: 500 11.5px/1 var(--mono); color: var(--text-3);
      padding: 9px 12px; border-top: 1px solid var(--line-soft);
      display: flex; gap: 12px; flex-wrap: wrap;
    }
    figcaption a { color: var(--teal); text-decoration: none; }
    .empty { font-size: 14px; color: var(--text-2); }
    .low { color: var(--amber); }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="box">
        <h1 id="title">Đang mở bản ghi…</h1>
        <span class="meta" id="meta"></span>
      </div>
      <div class="btnrow">
        <button class="btn primary" id="btnCopy">Sao chép</button>
        <button class="btn" id="btnDownload">Tải .md</button>
        <button class="btn" id="btnZip" title="Markdown + thư mục ảnh trong một file zip">Tải .zip</button>
      </div>
    </header>
    <div id="body"></div>
  </div>
  <script type="module" src="preview.js"></script>
</body>
</html>
